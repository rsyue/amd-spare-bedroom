name: CI

permissions:
  contents: read

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "lint"
          prune-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --only-group dev --no-install-project

      - name: Run Ruff Lint (with GitHub PR Annotations)
        run: uv run --locked --no-sync ruff check --output-format=github .

      - name: Verify Ruff Code Formatting
        run: uv run --locked --no-sync ruff format --check .

  typecheck:
    name: Typecheck (Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "typecheck"
          prune-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Mypy Type Checking
        run: uv run --locked mypy src tests

  test:
    name: Unit Tests (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "test"
          prune-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Pytest Suite (CPU / Non-GPU)
        run: uv run --locked pytest -m "not gpu" --cov=src --cov-report=term-missing
